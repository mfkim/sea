<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sea</title>
    <link rel="icon"
          href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌊</text></svg>">
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: #f0f8ff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .card {
            background: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
            text-align: center;
            max-width: 450px;
            width: 90%;
        }

        h1 {
            color: #006994;
            margin: 0 0 10px 0;
            font-size: 2.5rem;
        }

        p {
            color: #4a4a4a;
            line-height: 1.6;
            margin-bottom: 25px;
        }

        .tag {
            display: inline-block;
            background-color: #e1f5fe;
            color: #0277bd;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 20px;
        }

        code {
            background-color: #f1f1f1;
            padding: 2px 6px;
            border-radius: 4px;
            color: #d63384;
            font-family: "Courier New", Courier, monospace;
        }
    </style>
</head>
<body>
<div class="card">
    <h1>🌊 Sea Server</h1>
    <div class="tag">Status: Online</div>
    <img src="sea.jpg" alt="Sea Image" style="width: 100%; max-width: 200px; border-radius: 10px; margin-bottom: 15px;">
    <p>
        Welcome! This is a lightweight <strong>HTTP web server</strong><br>
        built from scratch using <strong>C Language</strong>.
    </p>
    <p style="font-size: 0.9rem; color: #888; margin-bottom: 0;">
        Currently serving static file: <code>index.html</code>
    </p>
</div>
</body>
</html>
